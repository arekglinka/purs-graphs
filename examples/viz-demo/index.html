<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>viz-demo — Interactive DOT Playground</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: sans-serif; margin: 0; padding: 2rem; background: #fafafa; color: #333; }
      h1 { color: #2e7d32; margin: 0 0 0.25rem; font-size: 1.5rem; }
      h3 { margin: 0 0 0.5rem; font-size: 1rem; color: #555; }

      .header { margin-bottom: 1.5rem; }
      .header p { margin: 0; color: #666; font-size: 0.9rem; }

      .layout { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; }
      .controls { width: 400px; display: flex; flex-direction: column; gap: 1rem; }
      .canvas { flex: 1; min-width: 300px; }

      .control-group { display: flex; flex-direction: column; gap: 0.4rem; }
      .control-group label { font-size: 0.8rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.03em; }

      .dot-editor {
        width: 100%; min-height: 160px; font-family: "SF Mono", "Fira Code", monospace;
        font-size: 0.82rem; line-height: 1.4; resize: vertical; tab-size: 2;
        background: #f5f5f5; border: 1px solid #ccc; border-radius: 4px;
      }
      .dot-editor:focus { outline: none; border-color: #2e7d32; background: white; }

      .inline-form { display: flex; gap: 0.4rem; align-items: center; }

      select { padding: 0.4rem 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; background: white; }
      select:focus { outline: none; border-color: #2e7d32; }

      .btn {
        padding: 0.4rem 0.8rem; background: #2e7d32; color: white; border: none;
        border-radius: 4px; cursor: pointer; font-size: 0.85rem; white-space: nowrap;
      }
      .btn:hover { background: #1b5e20; }

      .svg-container {
        border: 1px solid #ddd; border-radius: 4px; padding: 1rem;
        overflow-x: auto; background: white; min-height: 200px;
      }
      .svg-container svg { max-width: 100%; height: auto; }

      .error-box {
        margin-top: 0.5rem; padding: 0.75rem; background: #ffebee; color: #c62828;
        border: 1px solid #ef9a9a; border-radius: 4px; font-family: monospace;
        font-size: 0.82rem; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
