name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps (includes purs, spago, purs-backend-es, purs-tidy)
        run: npm ci

      - name: Check formatting (purs-tidy + biome)
        run: npm run format:check

      - name: Build workspace (all packages + examples)
        run: npm run build

      - name: Test purs-dagre
        run: npx spago test -p purs-dagre

      - name: Test purs-viz
        run: npx spago test -p purs-viz

      - name: Build dagre-demo example
        run: |
          cd examples/dagre-demo
          npm run build

      - name: Build viz-demo example
        run: |
          cd examples/viz-demo
          npm run build

      - name: Build showcase example
        run: |
          cd examples/showcase
          npm run build

  build-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm deps + build workspace
        run: |
          npm ci
          npm run build
          npx purs-backend-es build --corefn-dir output --output-dir output-es

      - name: Typecheck + build extension bundles
        run: |
          cd extensions/purs-graphs
          npm install --no-audit --no-fund
          npx tsc --noEmit
          node esbuild.mjs

      - name: Package VSIX
        run: |
          cd extensions/purs-graphs
          npx @vscode/vsce package --no-dependencies -o purs-graphs.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: purs-graphs-vsix
          path: extensions/purs-graphs/purs-graphs.vsix
